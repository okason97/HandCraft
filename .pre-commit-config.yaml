# Checks run by `git commit`. Install the hook once with `uv run pre-commit install` (see doc/development.md).
# The hooks use the ruff and ty versions pinned in uv.lock.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (lint, with safe fixes)
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ty-check
        name: ty check (types)
        # ty checks the whole project: a change in one file can break the types of another
        entry: uv run ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
