# Generator A, causal Transformer (doc/specs/2026-10-16-generator-a-design.md): HWGAT's 29 keypoints in 2D in the box
# space of stgcn/hwgat-data, 4 frames predicted per step, rollouts opened with 8 real frames.
DATA:
  name: "INCLUDE"
  poses: [["pose",[0,2,5,11,12,13,14,15,16]],["left_hand",[0,4,5,8,9,12,13,16,17,20]],["right_hand",[0,4,5,8,9,12,13,16,17,20]]]
  num_keypoints: 29
  num_classes: 262
  min_samples: 0
  oversample: False
  max_len: 64
  input_size: [64, 29, 2]
  transform: "none"
  coords: 2
  norm: "box"
  pixel_coords: True
  missing_hand: "wrist"
  test_drop_last: False
  pred_frames: 4
  opening_frames: 8
  gen_stop: "length"
  max_gen_len: 320
MODEL:
  backbone: "argen_tf"
  hidden_dim: 256
  nheads: 8
  mlp_dim: 1024
  depth: 4
  dropout: 0.1
  generation_noise: 0.0
LOSS:
  loss_type: "autoregressive"
  vel_weight: 1.0
  end_weight: 0.1
  end_pos_weight: 10.0
OPTIMIZATION:
  type_: "RAdam"
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0001
  beta1: 0.9
  beta2: 0.999
  total_steps: 200
  lrscheduler: "OneCycle"
  max_lr: 0.001
  pct_start: 0.1
  rollout_steps: 1
